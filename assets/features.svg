<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330"><rect width="1200" height="330" fill="#fff"/><rect x="6" y="6" width="388" height="153" fill="#d6ece0"/><text x="28" y="62" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="bold" fill="#14231b">Auto scheduling</text><text x="28" y="100" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#14231b">Class, lab, exam, ODeL and</text><text x="28" y="126" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#14231b">resit timetables</text><rect x="406" y="6" width="388" height="153" fill="#fbe3a5"/><text x="428" y="62" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="bold" fill="#14231b">No clashes</text><text x="428" y="100" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#14231b">Lecturers, groups, rooms and</text><text x="428" y="126" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#14231b">merged classes checked</text><rect x="806" y="6" width="388" height="153" fill="#a9d8bf"/><text x="828" y="62" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="bold" fill="#14231b">Approval flow</text><text x="828" y="100" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#14231b">Lecturer, HOD, DVC,</text><text x="828" y="126" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#14231b">Timetabler, Published</text><rect x="6" y="171" width="388" height="153" fill="#eaf3ee"/><text x="28" y="227" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="bold" fill="#14231b">Resits</text><text x="28" y="265" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#14231b">Registration, allocation,</text><text x="28" y="291" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#14231b">scheduling and PDFs</text><rect x="406" y="171" width="388" height="153" fill="#fbe3a5"/><text x="428" y="227" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="bold" fill="#14231b">Reports</text><text x="428" y="265" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#14231b">Branded PDF, Excel, CSV</text><text x="428" y="291" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#14231b">and Word output</text><rect x="806" y="171" width="388" height="153" fill="#d6ece0"/><text x="828" y="227" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="bold" fill="#14231b">Analytics</text><text x="828" y="265" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#14231b">Venue use, lecturer load,</text><text x="828" y="291" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#14231b">feasibility check</text></svg>